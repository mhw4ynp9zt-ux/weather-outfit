<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>今日なに着る?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>今日なに着る?</h1>
    <button id="open-settings" aria-label="設定">⚙ <span id="place-name"></span></button>
  </header>
  <div id="banner"></div>
  <nav id="tabs" role="tablist" aria-label="日付"></nav>
  <main id="day" aria-live="polite">読み込み中…</main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>設定</h2>
      <fieldset>
        <legend>場所</legend>
        <div class="row">
          <input id="city-input" type="search" placeholder="都市名(例: 大阪)" autocomplete="off">
          <button type="button" id="city-search">検索</button>
          <button type="button" id="use-location">現在地</button>
        </div>
        <ul id="city-results"></ul>
        <p id="place-message" class="msg"></p>
      </fieldset>
      <fieldset>
        <legend>寒がり度</legend>
        <label><input type="radio" name="sens" value="cold"> 寒がり</label>
        <label><input type="radio" name="sens" value="normal"> 普通</label>
        <label><input type="radio" name="sens" value="hot"> 暑がり</label>
      </fieldset>
      <fieldset>
        <legend>時間帯(開始〜終了の時)</legend>
        <div id="slot-inputs"></div>
        <p id="slot-message" class="msg"></p>
      </fieldset>
      <div class="row">
        <button type="button" id="close-settings">閉じる</button>
        <button type="submit" id="save-settings" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
